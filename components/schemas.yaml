id: schemas
version: 1
owner: Avinash
kind: deterministic
purpose: >-
  Versioned boundary records shared by every component (master architecture ch. 20). Records are
  closed, immutable, float-free and coercion-free for identity-bearing scalars, so a record's
  content ID is a stable identity. Current records: TaskManifest and Requirement (SIN-P1.1-002),
  EvaluationPolicy (003), CandidateManifest (004) and Observation (005); Finding and EpisodeState
  follow (006, 007).
inputs:
  - JSON or Python mappings from other components
outputs:
  - TaskManifest
  - Requirement
  - EvaluationPolicy
  - CandidateManifest
  - Observation
  - Finding
  - FindingTransition
  - EpisodeBudget
  - EpisodeState
  - Violation (cross-record check result value; not a Record, never persisted here)
may_read:
  - sindri.core
may_write: []
forbidden_read:
  - hidden_final_eval
  - judge internals
  - solver, triage and forge packages
forbidden_write:
  - acceptance_policy
  - any store (records are values; persistence is P1.2)
public_interfaces:
  - name: TaskManifest.model_validate / model_validate_json
    request: mapping or JSON
    response: TaskManifest
  - name: Requirement.model_validate / model_validate_json
    request: mapping or JSON
    response: Requirement
  - name: EvaluationPolicy.model_validate / model_validate_json
    request: mapping or JSON
    response: EvaluationPolicy
  - name: CandidateManifest.model_validate / model_validate_json
    request: mapping or JSON
    response: CandidateManifest
  - name: candidate_source_hash
    request: CandidateFile iterable
    response: ContentId (candidate_file_set_v1)
  - name: Observation.model_validate / model_validate_json
    request: mapping or JSON
    response: Observation
  - name: observation_execution_key
    request: the 15 execution-request fields
    response: ContentId (observation_execution_key_v1)
  - name: Finding / FindingTransition.model_validate
    request: mapping or JSON
    response: Finding, FindingTransition
  - name: EpisodeBudget / EpisodeState.model_validate
    request: mapping or JSON
    response: EpisodeBudget, EpisodeState
  - name: EpisodeBudget.remaining
    request: EpisodeState bound to this budget
    response: BudgetRemaining (derived; never stored)
  - name: Record.content_id
    request: record
    response: ContentId
  - name: check_records
    request: Iterable[Record] forming a deliberately assembled closed validation bundle (not a partial store query)
    response: tuple[Violation, ...] sorted by (code, subject, detail); TypeError for a non-Record or unsupported Record type
invariants:
  - id: INV-001
    text: Unknown fields are rejected at every nesting level.
  - id: INV-002
    text: Binary floats are rejected anywhere in a record (decision D5).
  - id: INV-003
    text: Authority mode, split, lineage identity, rights and mandatory status are never defaulted.
  - id: INV-004
    text: Version 1 has no supersedes; every later version names exactly one predecessor.
  - id: INV-005
    text: Read-only task types have an empty edit scope; mutating types a non-empty safe one.
  - id: INV-006
    text: Requirement records carry no verification obligations (ADR-0004).
  - id: INV-007
    text: Rights never forbid the use the split assigns (train needs training_allowed; dev/final need evaluation_allowed).
  # SIN-P1.1-003 EvaluationPolicy
  - id: INV-EP-001
    text: EvaluationPolicy is a judge-side protected record (E2); any solver projection exposes development-safe data only, never hidden checks, hidden configurations, protected assumptions or tool profiles.
  - id: INV-EP-002
    text: Check kinds are per-candidate only (E3); formal modes are bmc|prove (E4); quality checks are never mandatory and never the only check of an obligation (E8).
  - id: INV-EP-003
    text: Checks reference configurations by ConfigurationId, never index (E5); all references resolve inside the policy; a zero-parameter design has one explicit configuration with empty assignments (E5a).
  - id: INV-EP-004
    text: Exceptions are not-applicable exclusions of exact (check, configuration) pairs (E7), never FAIL->PASS, and never every configuration of a mandatory check (E9).
  # SIN-P1.1-004 CandidateManifest
  - id: INV-CM-001
    text: source_hash == canonical_json_id({"kind":"candidate_file_set_v1","files":[{path,hash}...] sorted by path}); only candidate_source_hash implements it.
  - id: INV-CM-002
    text: dependency_hash None means "explicitly no dependency bundle", never "unknown".
  - id: INV-CM-003
    text: parent_candidate_id and patch_hash are both set or both null; a candidate is never its own parent.
  - id: INV-CM-004
    text: solver requires episode_id; reconstructor forbids it; architecture_explorer has it optional (None = oracle-side, set = solver-side).
  - id: INV-CM-005
    text: author carries model, version, temperature_millis, seed, provenance_ref and a never-defaulted training_allowed.
  # SIN-P1.1-005 Observation
  - id: INV-OB-001
    text: Observation is the record of an attempted execution of one declared policy check (ADR-0005); diagnostic/qualification results are other types; quality is not an Observation kind in v1.
  - id: INV-OB-002
    text: execution_key == canonical_json_id({"kind":"observation_execution_key_v1", request fields}); only observation_execution_key implements it; result fields never enter it.
  - id: INV-OB-003
    text: Raw ToolStatus is never rewritten; TIMEOUT/TOOL_ERROR/UNSUPPORTED/INCONCLUSIVE never carry candidate failure evidence.
  - id: INV-OB-004
    text: PASS needs a complete report (all expected tests/properties, bound met); FAIL needs a report with candidate-attributed failure evidence and may be partial (R3).
  - id: INV-OB-006
    text: Synthesis PASS needs zero black boxes (master §14 J1); synthesis FAIL may rest on errors, black boxes or latches together with a candidate error. Latches are recorded but not judged until evaluator/profile semantics define expected latches (P1.4/P1.6).
  - id: INV-OB-005
    text: Hidden-check Observations are judge-side protected and never reach solver context (O14); authentication is evidence-store write authority, not a record field (O13).
  # SIN-P1.1-006 Finding
  - id: INV-FD-001
    text: Finding is an immutable claim about one exact candidate (task + candidate id + manifest hash) and one requirement; it carries no status; lifecycle lives in FindingTransition records.
  - id: INV-FD-002
    text: Transitions follow ALLOWED_FINDING_TRANSITIONS (no hypothesis->confirmed); exactly the transition into check_proposed carries a ProposedCheck; confirm/refute need deciding Observation citations (id + hash); dropped needs a typed reason.
  - id: INV-FD-004
    text: ExistingPolicyCheck carries confirming_status PASS|FAIL (the opposite refutes; mixed deciding PASS/FAIL invalid, checked in 009); DevelopmentProbeRequest is pinned by policy_hash and v1 allows only run_sim with tests or run_formal with properties; a probe-proposed Finding is never decided (009/P1.5).
  - id: INV-FD-003
    text: Supporting artifacts and development probes never decide a Finding (FD5, FD8, ADR-0005); producer provenance is a closed model|component|human union with a never-defaulted training_allowed.
  # SIN-P1.1-007 EpisodeState
  - id: INV-EP7-001
    text: EpisodeState is an immutable hash-chained snapshot (sequence 0 has no predecessor); states and transitions follow ADR-0006 (ALLOWED_EPISODE_TRANSITIONS).
  - id: INV-EP7-002
    text: WAITING has a resume_state among the active states and at least one pending job; terminal states have none; abort_reason exactly on ABORTED; active_candidate required from DEV_CHECK onwards (and in WAITING when resume_state requires it).
  - id: INV-EP7-003
    text: EpisodeBudget is identified by its content_id; additive limits may be zero, wall_clock_limit_ms > 0; wall-clock is not additive; remaining is derived (remaining() rejects a snapshot of another budget); reserved equals the sum of pending-job reservations; every pending job binds its request_hash and carries a required-but-nullable candidate, with no ObservationAction (jobs are broader than Observations, ADR-0005).
  # SIN-P1.1-008 serialization contract (tests only; no schema change)
  - id: INV-SER-001
    text: Every record and union variant round-trips through transport JSON, JSON-native dicts and canonical bytes to an equal record with the same content_id; same-serializer re-emission is byte-stable.
  - id: INV-SER-002
    text: content_id == canonical_json_id(model_dump(mode="json")); transport JSON (model_dump_json) is not the identity contract. Object-key order and formatting never affect identity; array/tuple order does (exact-record identity; no canonical sorting). Specialized hashes (source_hash, assignment_key) may ignore order.
  - id: INV-SER-003
    text: schema_version is 1 for every P1.1 record and anything else is rejected (v1 reader only; no dispatch, no migration). Domain revisions (manifest/requirement/policy_version + supersedes) are separate from schema_version.
  - id: INV-SER-004
    text: After JSON parsing, floats (incl. NaN/Infinity tokens) are rejected at every depth with their JSON path; authoritative ints/bools are never coerced; ExactScalar positions keep true, 1 and "1" distinct. Text is not Unicode-normalized.
  # SIN-P1.1-009 cross-record contract (src/sindri/schemas/cross_record.py; packet tables B-E)
  - id: INV-XR-001
    text: check_records is pure (no I/O, store, clock or input mutation), order-independent and idempotent (exact duplicates collapse by type + content_id); it aggregates every violation and never raises for an inconsistent bundle.
  - id: INV-XR-002
    text: Closed world. Every H1 hash reference (supersedes, candidate/policy/observation/finding/budget/state hashes, candidate bindings) resolves to exactly one record of its type, with a matching carried ID; one XR-B2 per broken reference occurrence. A conflicting logical key is XR-B1 (ambiguous authority). Rules that depend on a broken or ambiguous authority skip it (no cascades).
  - id: INV-XR-003
    text: Revision chains link to v-1 of the same type; task identity (X5 fields), requirement (task_id, requirement_id) and policy (policy_id, task_id) are stable; family heads share one split; mutation children keep the parent's family and lineage, and mutation ancestry is acyclic.
  - id: INV-XR-004
    text: Each head policy matches the head task contract, and every approved mandatory head requirement applies to >= 1 configuration and is enforced in each applicable configuration (exact-type applicability over a common policy vocabulary) by a mandatory, non-quality, targeted, non-excluded obligation check.
  - id: INV-XR-005
    text: Observations, Findings and transitions bind to the exact candidate manifest, policy, check, configuration and settings; deciding citations are PASS/FAIL and match an ExistingPolicyCheck proposal and its verdict mapping; probe-proposed Findings are never decided; solver Findings cite no hidden Observation; transition chains and EpisodeState chains are contiguous, hash-linked, legal (ADR-0006, WAITING resume), constant in policy/budget/solver config, monotonic, within budget except truthful per-dimension aborts, and keep pending jobs immutable.
  - id: INV-XR-006
    text: Exact historical revision bindings (candidate -> task revision, policy -> task revision, Finding -> requirement version) are not representable and are validated against current set heads only (L1-L3); store-global completeness, uniqueness and current head belong to P1.2 (packet table D).
failure_modes:
  - id: FM-001
    symptom: A field gains a default and silently fills authority/split/rights.
    guard: Required-field tests per field; planted-bug checks in SIN-P1.1-002.
  - id: FM-002
    symptom: Pydantic coerces True/1.0 into an int or Literal.
    guard: StrictInt/StrictBool/StrictStr scalars; schema_version is a StrictInt pinned to 1.
  - id: FM-XR-001
    symptom: A cross-record rule silently stops firing, or two rules report one root cause.
    guard: Isolated exact-set negative fixture per runtime code, plus the rule-removal harness (tests/contract/cross_record/test_rule_harness.py).
  - id: FM-XR-002
    symptom: A new ContentId field escapes the cross-record contract.
    guard: CT-1 inventory (test_hash_inventory.py) fails until the field is classified H1/H2/H3.
required_tests:
  - unit
  - contract
observability:
  spans: []
  metrics: []
related_adrs: [ADR-0001, ADR-0002, ADR-0004, ADR-0005, ADR-0006]
related_docs: [docs/tasks/SIN-P1.1-002.md, docs/tasks/SIN-P1.1-003.md, docs/tasks/SIN-P1.1-004.md, docs/tasks/SIN-P1.1-005.md, docs/tasks/SIN-P1.1-006.md, docs/tasks/SIN-P1.1-007.md, docs/tasks/SIN-P1.1-008.md, docs/tasks/SIN-P1.1-009.md]
