[project]
name = "sindri-factory"
version = "0.0.1"
description = "Sindri verified hardware engineering and data factory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sindri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: expensive checks run on schedule (formal, mutation, leakage)",
    "eda: requires pinned EDA tool images",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S110"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sindri"]
mypy_path = "src"
