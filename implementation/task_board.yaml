# Coordinator adds tasks only after creating docs/tasks/<id>.md (scripts/new_task.py).
# status: planned | ready | active | blocked | review | merged | verified | closed
#   review   = PR open, awaiting review
#   merged   = on main; NOT yet demonstrated in integrated operation
#   verified = coordinator confirmed acceptance evidence on main (e.g. an adapter's known-good,
#              known-bad, timeout and unsupported fixtures all yield the right Observation)
#   closed   = verified and nothing outstanding (handoff final, follow-ups filed)
#   Agents may move a task up to `review`; merged/verified/closed are coordinator transitions.
# Only `ready` tasks may be assigned to coding agents. A task may be `ready` only when every
# depends_on entry is merged/verified/closed (or a completed gate) and its phase is ACTIVE.
# Format is restricted (flat keys per task) so scripts/show_ready_tasks.py can read it without
# dependencies; tests/unit/test_governance.py validates it.
tasks:
  - id: SIN-B0.1-001
    title: Install governance pack v2 with amendments
    phase: B0
    subphase: B0.1
    status: merged
    depends_on: []
    packet: docs/tasks/SIN-B0.1-001.md

  - id: SIN-B0.1-002
